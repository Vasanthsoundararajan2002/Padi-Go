[project]
name = "padi-and-go-ai"
version = "0.2.0"
description = "ADK 2 textbook-grounded tutor backend for Padi and Go"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=0.5.0",
  "fastapi",
  "google-adk==2.10.0",
  "google-search-results>=2.4.2",
  "huggingface-hub>=0.25.0",
  "langchain-text-splitters>=0.3.0",
  "litellm>=1.77.0",
  "pillow>=10.0.0",
  "pymupdf>=1.24.0",
  "pypdf>=4.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=3.0.0",
  "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]
